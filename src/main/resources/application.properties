# Safe defaults for local development. Credentials must be supplied as environment variables.
redis.uri=redis://localhost:6379
harness.redis.inbound-stream=harness:inbound
harness.redis.outbound-stream=harness:outbound
harness.redis.consumer-group=flink-harness-inbound
redis.queue.consumer.idle-wait-millis=1000
telegram.callback-registry-ttl-seconds=86400
# Configure one or more bots through TELEGRAM_BOT_<N>_TOKEN and related variables.
